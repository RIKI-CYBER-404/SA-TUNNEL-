name: Build SA TUNNEL APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '.github/workflows/main.yml'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: sa-tunnel-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find . -type f -path '*/app/build.gradle.kts' -print -quit | sed 's|/app/build.gradle.kts$||')"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find . -type f -path '*/app/build.gradle' -print -quit | sed 's|/app/build.gradle$||')"
          fi
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle.kts" -a ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo 'ERROR: Android Gradle project not found.'
            echo 'Expected a folder containing settings.gradle(.kts) and app/build.gradle(.kts).'
            echo 'Repository files (first 250):'
            find . -maxdepth 5 -type f | sort | head -250
            exit 1
          fi
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Accept Android SDK licenses
        shell: bash
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo 'ERROR: sdkmanager was not found under cmdline-tools.'
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using: $SDKMANAGER"
          # Feed stdin from Python rather than `yes | sdkmanager`; the latter
          # can exit with SIGPIPE/Broken pipe after sdkmanager finishes early.
          python3 - "$SDKMANAGER" "$SDK_ROOT" <<'PY'
          import subprocess
          import sys
          manager, sdk_root = sys.argv[1], sys.argv[2]
          result = subprocess.run(
              [manager, f"--sdk_root={sdk_root}", "--licenses"],
              input="y\n" * 100,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              timeout=600,
          )
          print(result.stdout)
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          PY

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$ANDROID_HOME/platform-tools/adb"
          java -version
          go version
          echo 'Android SDK, build-tools and NDK are ready.'

      - name: Build official libXray AAR
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [ ! -f "$PROJECT_DIR/build_core.sh" ]; then
            echo "ERROR: $PROJECT_DIR/build_core.sh is missing. Cannot build the Xray AAR required by this project."
            exit 1
          fi
          chmod +x "$PROJECT_DIR/build_core.sh"
          bash "$PROJECT_DIR/build_core.sh"
          test -s "$PROJECT_DIR/app/libs/libXray.aar"
          echo 'libXray.aar built successfully.'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-TUNNEL-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
