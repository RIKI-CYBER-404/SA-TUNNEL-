name: Build SA TUNNEL APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: sa-tunnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find or extract Android project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          # First check whether the Android project is already in the repository.
          APP_GRADLE="$(find . -type f \( -path '*/app/build.gradle.kts' -o -path '*/app/build.gradle' \) -not -path './.git/*' -print -quit)"

          # If it is not present, extract the ZIP uploaded to the repository root.
          if [ -z "$APP_GRADLE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'SA-TUNNEL-FIXED.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -print -quit)"
            fi
            if [ -z "$ZIP_FILE" ]; then
              echo 'ERROR: No Android project and no project ZIP found.'
              echo 'Upload the SA-TUNNEL-FIXED.zip file to the repository root.'
              exit 1
            fi
            echo "Extracting: $ZIP_FILE"
            mkdir -p "$GITHUB_WORKSPACE/_extracted"
            unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_extracted"
            APP_GRADLE="$(find "$GITHUB_WORKSPACE/_extracted" -type f \( -path '*/app/build.gradle.kts' -o -path '*/app/build.gradle' \) -print -quit)"
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo 'ERROR: Android Gradle project not found.'
            echo 'Expected app/build.gradle.kts or app/build.gradle inside the ZIP.'
            find "$GITHUB_WORKSPACE" -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) missing in $PROJECT_DIR"
            exit 1
          fi
          if [ ! -f "$PROJECT_DIR/build_core.sh" ]; then
            echo "ERROR: build_core.sh missing in $PROJECT_DIR"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          python3 - "$SDKMANAGER" "$SDK_ROOT" <<'PY'
          import subprocess
          import sys
          manager, sdk_root = sys.argv[1], sys.argv[2]
          result = subprocess.run(
              [manager, f"--sdk_root={sdk_root}", "--licenses"],
              input="y\n" * 100,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              timeout=600,
          )
          print(result.stdout)
          sys.exit(result.returncode)
          PY

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          java -version
          go version
          echo 'Android SDK, build tools and NDK are ready.'

      - name: Build official libXray AAR
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./build_core.sh
          ./build_core.sh
          test -s app/libs/libXray.aar
          echo 'libXray.aar created successfully.'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-TUNNEL-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
